[project]
name = "granola-organizer"
version = "1.0.0"
description = "Save Granola meeting transcripts to markdown and file them into per-client folders, via the official API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["granola", "meeting-notes", "transcripts", "markdown", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/adampaulwalker/granola-organizer"
Repository = "https://github.com/adampaulwalker/granola-organizer"
Issues = "https://github.com/adampaulwalker/granola-organizer/issues"

[project.scripts]
granola-organizer = "granola_organizer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["granola_organizer"]
